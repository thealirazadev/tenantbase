name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.3", "8.4"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-retries 30
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql
          coverage: pcov
          # pcov only instruments src/ by default when it exists; app/ needs it too.
          ini-values: pcov.directory=.

      # Tests connect as a NOSUPERUSER NOBYPASSRLS role, never the superuser (docs/testing.md).
      - name: Create the app role and databases
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE tenantbase_app LOGIN PASSWORD 'secret' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE tenantbase OWNER tenantbase_app"
          psql -h localhost -U postgres -c "CREATE DATABASE tenantbase_test OWNER tenantbase_app"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Tests with coverage
        run: php artisan test --coverage
